<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Fanzine Runner · ¡No te rindas!</title>
  <meta name="description" content="Runner 2D arcade para jugar desde el celular sobre la cámara real. Un toque salta, dos toques hacen doble salto. Funciona sin conexión.">
  <meta name="theme-color" content="#0b0d14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="ASSETS/chicaquieta.png" type="image/png">
  <link rel="apple-touch-icon" href="ASSETS/chicaquieta.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Canvas del juego -->
  <canvas id="game" aria-label="Juego runner"></canvas>

  <!-- Auxiliares -->
  <div id="safe-probe" aria-hidden="true"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Pantalla de inicio sobre el portal de la UNLaM -->
  <main id="overlay" class="is-loading" tabindex="0">
    <div class="overlay__top">
      <h1 class="overlay__title">¡No te rindas!</h1>
      <div class="picker" role="group" aria-label="Elegí tu personaje">
        <button id="pick-chica" class="picker__btn" type="button" data-char="chica" aria-pressed="true" title="Elegir Chica">
          <img src="ASSETS/chicaquieta.png" alt="Chica" height="54">
        </button>
        <button id="pick-chico" class="picker__btn" type="button" data-char="chico" aria-pressed="false" title="Elegir Chico">
          <img src="ASSETS/chicoquieto.png" alt="Chico" height="54">
        </button>
      </div>
    </div>

    <div class="overlay__bottom">
      <button id="start-btn" class="overlay__start" type="button">
        🚪 Entrar a la UNLaM
      </button>
      <p id="start-label" class="overlay__hint">Hacé <b>clic en la puerta</b> o <b>dos toques</b> para entrar</p>

      <section id="hiscores-box" class="scores" aria-label="Mejores puntajes" hidden>
        <h2 class="scores__title">★ Mejores puntajes ★</h2>
        <ol id="hiscores" class="scores__list"></ol>
      </section>
    </div>
  </main>

  <script src="game.js"></script>
  <script>
    // Registro del Service Worker (modo offline). Requiere HTTPS o localhost.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function (err) {
          console.warn('[SW] No se pudo registrar:', err);
        });
      });
    }
  </script>
</body>
</html>
