<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Fanzine Runner · Corré, saltá y esquivá</title>
  <meta name="description" content="Runner 2D arcade para jugar desde el celular sobre la cámara real. Un toque salta, dos toques hacen doble salto. Funciona sin conexión.">
  <meta name="theme-color" content="#0b0d14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="ASSETS/chicaquieta.png" type="image/png">
  <link rel="apple-touch-icon" href="ASSETS/chicaquieta.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Capa 1: cámara trasera en vivo -->
  <video id="camera" autoplay muted playsinline webkit-playsinline disablepictureinpicture></video>

  <!-- Capa 2: canvas transparente con el juego -->
  <canvas id="game" aria-label="Juego runner"></canvas>

  <!-- Auxiliares -->
  <div id="safe-probe" aria-hidden="true"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Capa 3: pantalla de inicio (necesaria para permisos de cámara y fullscreen) -->
  <main id="overlay" class="is-loading" tabindex="0">
    <div class="overlay__inner">
      <img id="overlay-logo" class="overlay__logo" src="ASSETS/Inicio.png" alt="Portal de la universidad" width="1106" height="581" decoding="async">
      <h1 class="overlay__title">Corré. Saltá. Esquivá.</h1>

      <div class="picker" role="group" aria-label="Elegí tu personaje">
        <button id="pick-chica" class="picker__btn" type="button" data-char="chica" aria-pressed="true">
          <img src="ASSETS/chicaquieta.png" alt="Chica" height="64">
        </button>
        <button id="pick-chico" class="picker__btn" type="button" data-char="chico" aria-pressed="false">
          <img src="ASSETS/chicoquieto.png" alt="Chico" height="64">
        </button>
      </div>

      <p id="start-label" class="overlay__start">Cargando…</p>
      <p class="overlay__hint"><b>1 toque</b> salto &nbsp;·&nbsp; <b>2 toques</b> doble salto</p>
      <p class="overlay__hint overlay__hint--small">Usa la cámara trasera de tu celular como fondo</p>
    </div>
  </main>

  <script src="game.js"></script>
  <script>
    // Registro del Service Worker (modo offline). Requiere HTTPS o localhost.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function (err) {
          console.warn('[SW] No se pudo registrar:', err);
        });
      });
    }
  </script>
</body>
</html>
