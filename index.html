<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Fanzine Runner · ¡No te rindas!</title>
  <meta name="description" content="Runner 2D arcade en el campus de la UNLaM. ¡No te rindas! Salto y multi-salto infinito. Funciona sin conexión.">
  <meta name="theme-color" content="#0b0d14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="ASSETS/chicaquieta.png" type="image/png">
  <link rel="apple-touch-icon" href="ASSETS/chicaquieta.png">
  <link rel="stylesheet" href="style.css?v=22">
</head>
<body>
  <!-- Canvas del juego -->
  <canvas id="game" aria-label="Juego runner"></canvas>

  <!-- Aviso de rotación para dispositivos móviles en vertical -->
  <aside id="rotate-device-modal" class="rotate-modal" aria-hidden="true" role="dialog" aria-label="Girá tu pantalla para jugar">
    <div class="rotate-modal__content">
      <div class="rotate-modal__icon" aria-hidden="true">
        <svg viewBox="0 0 100 100" class="rotate-phone-svg" width="96" height="96">
          <!-- Silueta del celular rotando -->
          <rect class="phone-body" x="32" y="16" width="36" height="68" rx="6" />
          <circle class="phone-home" cx="50" cy="76" r="2.5" />
          <line class="phone-speaker" x1="43" y1="24" x2="57" y2="24" />
          <!-- Flecha de rotación -->
          <path class="rotate-arrow" d="M 76 32 A 38 38 0 0 1 76 68 L 82 62 M 76 68 L 68 66" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <h2 class="rotate-modal__title">¡GIRÁ TU PANTALLA!</h2>
      <p class="rotate-modal__text">Para jugar a <b>Fanzine Runner</b> colocá tu celular en <b>modo horizontal</b> (apaisado).</p>
      <div class="rotate-modal__badge">📱 ↺ Modo Horizontal</div>
    </div>
  </aside>

  <!-- Auxiliares -->
  <div id="safe-probe" aria-hidden="true"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Pantalla de inicio: logo + elección de personaje + COMENZAR + ranking global -->
  <main id="overlay" class="is-loading">
    <div class="start">
      <h1 class="start__logo">
        <img src="ASSETS/logonoterindas.png" alt="¡No te rindas!" width="1279" height="484" decoding="async">
      </h1>

      <section class="start__pick" aria-labelledby="pick-title">
        <h2 id="pick-title" class="start__label">Elegí tu personaje</h2>
        <div class="picker" role="group" aria-label="Elegí tu personaje">
          <button id="pick-chica" class="picker__btn" type="button" data-char="chica" aria-pressed="true" aria-label="Chica">
            <img src="ASSETS/chicaquieta.png" alt="" height="110">
          </button>
          <button id="pick-chico" class="picker__btn" type="button" data-char="chico" aria-pressed="false" aria-label="Chico">
            <img src="ASSETS/chicoquieto.png" alt="" height="110">
          </button>
        </div>
      </section>

      <button id="start-btn" class="start__btn" type="button">Cargando…</button>
      <p class="start__hint"><b>Tocá</b> o barra espaciadora para saltar · ¡ojo con el <b>tero</b> en el cielo!</p>

      <section id="hiscores-box" class="scores" aria-label="Ranking global">
        <h2 class="scores__title">★ Ranking global · Top 5 ★</h2>
        <div class="scores__personal" id="scores-personal" aria-label="Tu récord actual">
          <span class="scores__personal-label">Tu récord actual</span>
          <span class="scores__personal-pts" id="personal-record-pts">00000</span>
        </div>
        <ol id="hiscores" class="scores__list"></ol>
        <p id="hiscores-status" class="scores__status" data-state="loading" role="status"></p>
      </section>
    </div>
  </main>

  <!-- Botón para saltar el tutorial (visible durante el tutorial) -->
  <button id="skip-tutorial-btn" class="skip-tutorial-btn" type="button">Saltar tutorial ⏭</button>

  <!-- Volver a la pantalla de inicio (solo visible en game over) -->
  <button id="menu-btn" class="menu-btn" type="button">↩ Menú</button>

  <script src="game.js?v=30"></script>
  <script>
    // Registro del Service Worker (modo offline). Requiere HTTPS o localhost.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function (err) {
          console.warn('[SW] No se pudo registrar:', err);
        });
      });
    }
  </script>
</body>
</html>
